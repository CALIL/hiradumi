<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiradumi</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>

<body>
  <script type="module">
    import './src/index.ts';
  </script>
  <hiradumi-component>
    <!-- <div slot="header">これはヘッダースロットに入ります</div>
    <div slot="footer">これはフッタースロットに入ります</div> -->
    <div>
    </div>
  </hiradumi-component>
  <script>
    customElements.whenDefined('hiradumi-component').then(async () => {
      const r = await fetch('https://bookdata-fair.calil.dev/all.json')
      const items = await r.json();
      // console.log(items);
      const mixedItems = []
      let count = 1
      items.forEach((item, index) => {
        if (item.properties && item.properties.aspect) {
          item.aspect = item.properties.aspect;
        }
        item.type = 'image'
        mixedItems.push(item)
        if (index % 10 === 0) {
          mixedItems.push({
            type: 'text',
            title: 'text' + count,
          })
          count++
        }
      });
      const hiradumi = document.querySelector('hiradumi-component');
      hiradumi.width = window.innerWidth;
      hiradumi.height = window.innerHeight;
      hiradumi.data = mixedItems;
    });
  </script>
</body>

</html>

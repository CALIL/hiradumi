name: Build and Deploy

# GitHub Pages への配信。gh-pages ブランチを経由せず、公式 Action で
# ビルド成果物を直接 Pages へ渡す。
#
# 前提: リポジトリ設定 Settings → Pages → Source が "GitHub Actions" であること。
# "Deploy from a branch" のままだと、このワークフローは成功しても公開内容が
# 更新されない（古い gh-pages の内容が配信され続ける）。
on:
  push:
    branches:
      - master

permissions: {}

# 配信が同時に走らないよう直列化する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    # runs-on: [self-hosted, Linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # 配信は artifact 経由で行うため、checkout の資格情報は使わない
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and Build 🔧
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Pages へ配信する
      id-token: write   # 配信元を検証する OIDC トークンの発行
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

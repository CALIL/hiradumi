name: Build and Deploy
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    # runs-on: [self-hosted, Linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7 # zizmor: ignore[artipacked] 後続のDeployステップがこのcheckoutの資格情報でgh-pagesブランチへpushするため、persist-credentialsは無効化しない
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and Build 🔧
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: dist
